name: Update visitor stats

# Pulls country-level statistics from GoatCounter and publishes them as a small
# JSON file on the `visitor-data` branch, which the visitor map on the about
# page fetches via raw.githubusercontent.com (CORS-enabled). Requires the
# repository secret GC_TOKEN (GoatCounter API token, "read statistics" scope).

on:
  schedule:
    - cron: "23 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch statistics from GoatCounter
        env:
          GC_TOKEN: ${{ secrets.GC_TOKEN }}
          GC_SITE: shyyhs
          TRACKING_START: "2026-08-11"
        id: fetch
        run: |
          set -euo pipefail
          end=$(date -u +%F)
          api="https://${GC_SITE}.goatcounter.com/api/v0"

          # gc_get URL -> prints the response body on HTTP 200 (return 0);
          # returns 1 on 401/403 (bad token: a real failure that must email us);
          # returns 75 on anything else (5xx, 429, timeouts, connection errors):
          # transient upstream trouble, handled by skipping this run.
          gc_get() {
            local url="$1" body code
            if ! body=$(curl -s --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors \
                -H "Authorization: Bearer ${GC_TOKEN}" -H "Content-Type: application/json" \
                -w '\n%{http_code}' "$url"); then
              echo "reason=unreachable" > "$RUNNER_TEMP/skip"; return 75
            fi
            code=${body##*$'\n'}
            body=${body%$'\n'*}
            case "$code" in
              200) printf '%s' "$body"; return 0 ;;
              401|403) echo "::error::GoatCounter rejected the API token (HTTP $code). Rotate the GC_TOKEN secret." >&2; return 1 ;;
              *) echo "reason=HTTP $code" > "$RUNNER_TEMP/skip"; return 75 ;;
            esac
          }
          # fetch VAR URL -> assigns the body to VAR, or exits the step:
          # exit 0 + skip flag on transient trouble, exit 1 on auth failure.
          fetch() {
            local __var="$1" __url="$2" __out __rc=0
            __out=$(gc_get "$__url") || __rc=$?
            if [ "$__rc" -eq 0 ]; then printf -v "$__var" '%s' "$__out"; return 0; fi
            if [ "$__rc" -eq 75 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::GoatCounter unavailable ($(cat "$RUNNER_TEMP/skip")); keeping the previously published data. Next hourly run will catch up."
              exit 0
            fi
            exit 1
          }

          fetch total_json "${api}/stats/total?start=${TRACKING_START}&end=${end}"
          total=$(echo "$total_json" | jq '.total // 0')

          fetch page0 "${api}/stats/locations?start=${TRACKING_START}&end=${end}&limit=100"
          stats=$(echo "$page0" | jq '.stats')
          if [ "$(echo "$page0" | jq '.more')" = "true" ]; then
            fetch page1 "${api}/stats/locations?start=${TRACKING_START}&end=${end}&limit=100&offset=100"
            stats=$(jq -n --argjson a "$stats" --argjson b "$(echo "$page1" | jq '.stats')" '$a + $b')
          fi

          jq -n --argjson total "$total" --argjson stats "$stats" '
            ([ $stats[] | select(.id | test("^[A-Z]{2}$")) | { code: .id, visitors: .count } ]
              | sort_by(-.visitors)) as $countries
            | {
                # stats/total and stats/locations round day boundaries slightly
                # differently, so take whichever is larger.
                totalVisitors: ([ $total, ([ $countries[].visitors ] | add // 0) ] | max),
                countries: $countries,
                updatedAt: (now | todate)
              }' > visitors.json

          echo "Generated:" && cat visitors.json

      - name: Publish to the visitor-data branch
        if: steps.fetch.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir out && mv visitors.json out/ && cd out
          git init -q -b visitor-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visitors.json
          git commit -q -m "Update visitor stats"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" visitor-data
